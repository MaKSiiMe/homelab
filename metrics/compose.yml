name: metrics

# Monitoring, phase 2 : Prometheus + Alertmanager + Grafana + exporters.
#
# Portainer CE ne sait pas monter un fichier du dépôt (chemins relatifs = Business
# Edition) : les fichiers de config sont donc écrits en ligne (`configs: content`)
# et copiés dans les conteneurs à leur création.
#
# ⚠️ Deux règles à respecter en modifiant ce fichier :
#  1. Dans les blocs `content`, Compose interpole les variables : écrire `$$`
#     pour obtenir un `$` (ex. `{{ $$labels.instance }}`, `{{ $$value }}`).
#  2. Compose ne recrée pas un conteneur quand seul le contenu d'une config
#     change. Après toute modification sous `configs:`, incrémenter
#     `homelab.config-rev` ci-dessous, sinon l'ancienne config reste en place.
#  3. Exception : les configs `*_url` / `*_password` en fin de bloc portent des
#     secrets et utilisent volontairement `${VAR:?…}` (un seul `$`) : la valeur
#     vient des variables de la stack Portainer. Après un changement de secret
#     dans Portainer, incrémenter aussi `homelab.config-rev`.

x-config-rev: &config-rev
  homelab.config-rev: "5"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB      # garde-fou disque (sda2)
      - --web.external-url=http://100.124.153.20:9090
    labels: *config-rev
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/rules.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "100.124.153.20:9090:9090"
    networks: [metrics]
    mem_limit: 512m
    memswap_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://100.124.153.20:9093
      - --cluster.listen-address=              # pas de cluster : ferme le port 9094
    labels: *config-rev
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
      - source: discord_webhook_url
        target: /run/secrets/discord_webhook_url
      - source: healthchecks_watchdog_url
        target: /run/secrets/healthchecks_watchdog_url
      - source: sn44_discord_webhook_url
        target: /run/secrets/sn44_discord_webhook_url
    volumes:
      - alertmanager_data:/alertmanager       # silences et état des notifications
    ports:
      - "100.124.153.20:9093:9093"
    networks: [metrics]
    mem_limit: 64m
    memswap_limit: 64m

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password   # lu au 1er démarrage seulement
      GF_SERVER_ROOT_URL: http://100.124.153.20:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # pas de plugins téléchargés au démarrage
    labels: *config-rev
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/homelab.yml
      - source: grafana_dashboard_sn44
        target: /etc/grafana/dashboards/sn44.json
      - source: grafana_admin_password
        target: /run/secrets/grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "100.124.153.20:3000:3000"
    networks: [metrics]
    depends_on: [prometheus]
    # 256m ne suffisait pas : ~190 Mo anonymes au repos, le reste de la limite ne
    # tenait pas le binaire et grafana.db en cache (évincés puis relus en boucle,
    # ~90 Go lus en 17 h). Pas de swap : il est sur le SSD, un OOM se voit
    # (ConteneurOomKill), une usure silencieuse non.
    # 512m -> 640m le 27/11 : ~400 Mo avant le tableau de bord SN44, 495 Mo après
    # (ConteneurProcheLimiteMemoire à 91,6 %).
    mem_limit: 640m
    memswap_limit: 640m

  # Métriques de l'hôte. Réseau de l'hôte (sinon on ne voit que le trafic du
  # conteneur), mais écoute uniquement sur la passerelle du pont `br-metrics` :
  # invisible depuis le LAN et Tailscale. Démarre même si le pont n'existe pas
  # encore grâce à net.ipv4.ip_nonlocal_bind=1.
  # Nécessite une règle UFW (voir README).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.203.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    memswap_limit: 64m

  # Métriques par conteneur. API Docker via le socket-proxy en lecture seule
  # de la stack `monitoring`. Docker utilise le stockage d'images de containerd
  # (snapshotter `overlayfs`) : cAdvisor doit alors interroger containerd pour
  # chaque conteneur, sinon sa factory Docker ne s'enregistre pas et aucun
  # conteneur n'est nommé. ⚠️ Ce socket donne un contrôle total sur containerd
  # (`:ro` ne restreint pas l'API) : compromis accepté, cAdvisor n'a aucun port
  # publié et son image est épinglée.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --docker=tcp://socket-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=30s            # défaut 1s : trop pour l'i5-3337U
      - --enable_metrics=cpu,memory,network,diskIO,oom_event,pressure   # pas `disk` (du sur chaque conteneur)
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    devices:
      - /dev/kmsg                              # événements OOM
    cap_add: [SYSLOG]                          # lecture de /dev/kmsg (dmesg_restrict=1)
    networks: [metrics, socket]
    mem_limit: 256m
    memswap_limit: 256m

  # SMART des deux SSD (usure, température, erreurs).
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: smartctl-exporter
    restart: unless-stopped
    user: root
    devices:
      - /dev/sda
      - /dev/sdb
    cap_add: [SYS_RAWIO]                       # requêtes ATA (SG_IO)
    networks: [metrics]
    mem_limit: 64m
    memswap_limit: 64m

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 30s
        evaluation_interval: 30s

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]

      rule_files:
        - /etc/prometheus/rules.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: alertmanager
          static_configs:
            - targets: ["alertmanager:9093"]

        - job_name: grafana
          static_configs:
            - targets: ["grafana:3000"]

        - job_name: node
          static_configs:
            - targets: ["10.203.0.1:9100"]
              labels:
                instance: s56c-srv

        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
              labels:
                instance: s56c-srv

        - job_name: smartctl
          scrape_interval: 60s
          static_configs:
            - targets: ["smartctl-exporter:9633"]
              labels:
                instance: s56c-srv

        # Stack sn44 : collecteur SN44. Le label projet route ses alertes
        # (CibleInjoignable comprise) vers le webhook Discord dédié.
        - job_name: sn44
          scrape_interval: 60s
          static_configs:
            - targets: ["sn44-collector:9108"]
              labels:
                instance: s56c-srv
                projet: sn44

  prometheus_rules:
    content: |
      groups:
        # Kuma surveille déjà « le conteneur tourne-t-il ? ». Ici : ressources,
        # tendances, matériel, et la santé du pipeline lui-même.
        - name: pipeline
          rules:
            # Toujours active. Alertmanager la transmet à healthchecks.io toutes
            # les ~2 min : si elle cesse, Prometheus ou Alertmanager est tombé.
            - alert: Watchdog
              expr: vector(1)
              labels:
                severity: none
              annotations:
                summary: Pipeline Prometheus → Alertmanager vivant

            - alert: CibleInjoignable
              expr: up == 0
              for: 3m
              labels:
                severity: warning
              annotations:
                summary: "Prometheus n'arrive plus à collecter {{ $$labels.job }} ({{ $$labels.instance }})"

        - name: hote
          rules:
            - alert: MemoireFaible
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "RAM disponible : {{ $$value | humanizePercentage }}"

            - alert: SwapSature
              expr: 1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes > 0.5
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Swap utilisé à {{ $$value | humanizePercentage }}"

            - alert: OomKillNoyau
              expr: increase(node_vmstat_oom_kill[15m]) > 0
              labels:
                severity: warning
              annotations:
                summary: Le noyau a tué un processus faute de mémoire (voir dmesg)

            - alert: DisquePresquePlein
              expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes < 0.15
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.mountpoint }} : {{ $$value | humanizePercentage }} libres"

            - alert: DisquePresquePlein
              expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes < 0.05
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$labels.mountpoint }} : {{ $$value | humanizePercentage }} libres"

            - alert: DisquePleinSous24h
              expr: |
                predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}[6h], 24 * 3600) < 0
                and node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes < 0.40
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.mountpoint }} sera plein dans moins de 24 h au rythme actuel"

            - alert: CpuSature
              expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "CPU occupé à {{ $$value | humanizePercentage }} depuis 15 min"

            - alert: AttenteDisque
              expr: avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.20
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "iowait à {{ $$value | humanizePercentage }} : le disque ralentit le serveur"

            - alert: Surchauffe
              expr: node_hwmon_temp_celsius > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.chip }} {{ $$labels.sensor }} à {{ $$value }} °C"

            - alert: Surchauffe
              expr: node_hwmon_temp_celsius > 95
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$labels.chip }} {{ $$labels.sensor }} à {{ $$value }} °C"

            - alert: HorlogeDesynchronisee
              expr: node_timex_sync_status == 0 or abs(node_timex_offset_seconds) > 0.5
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: L'horloge n'est plus synchronisée par NTP (wikimastered compare des horodatages)

            - alert: Redemarrage
              expr: changes(node_boot_time_seconds[15m]) > 0
              labels:
                severity: warning
              annotations:
                summary: Le serveur a redémarré

        - name: conteneurs
          rules:
            # Working set = anonyme + cache actif : c'est ce que le noyau ne peut
            # pas récupérer sans relire le disque. `for` + `keep_firing_for`
            # contre le bagotage autour de 90 % (creux de moins de 15 min ignorés).
            - alert: ConteneurProcheLimiteMemoire
              expr: |
                container_memory_working_set_bytes{name!=""}
                  / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.90
              for: 15m
              keep_firing_for: 15m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.name }} utilise {{ $$value | humanizePercentage }} de sa limite mémoire"

            # Défauts de page majeurs = pages relues depuis le disque (cache évincé
            # ou swap). Au repos, les conteneurs sains ne dépassent pas ~1,3/s sur
            # 10 min (démarrages compris) ; grafana à 256m n'est jamais descendu
            # sous 16/s. Seuil 10/s entre les deux. Fenêtre 10m < for 15m : un pic
            # isolé (démarrage) sort de la fenêtre avant de pouvoir déclencher.
            - alert: ConteneurThrashing
              expr: |
                rate(container_memory_failures_total{failure_type="pgmajfault",scope="container",name!=""}[10m]) > 10
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.name }} relit sa mémoire depuis le disque ({{ $$value | humanize }} défauts majeurs/s) : mem_limit trop bas ?"

            - alert: ConteneurOomKill
              expr: increase(container_oom_events_total{name!=""}[15m]) > 0
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.name }} a été tué faute de mémoire (mem_limit trop bas ?)"

            - alert: ConteneurRedemarreEnBoucle
              expr: changes(container_start_time_seconds{name!=""}[30m]) > 3
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.name }} a redémarré {{ $$value }} fois en 30 min"

        - name: disques
          rules:
            - alert: SmartEnEchec
              expr: smartctl_device_smart_status != 1
              labels:
                severity: critical
              annotations:
                summary: "SMART en échec sur {{ $$labels.device }} : sauvegarder et remplacer"

            - alert: SsdUse
              expr: smartctl_device_percentage_used > 80
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.device }} : {{ $$value }} % de l'endurance consommée"

            - alert: SsdChaud
              expr: smartctl_device_temperature{temperature_type="current"} > 60
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "{{ $$labels.device }} à {{ $$value }} °C"

        # Minage SN44 : santé du collecteur et changements côté Score.
        - name: sn44
          rules:
            - alert: SN44CollecteurMuet
              expr: time() - sn44_collector_last_success_timestamp_seconds{source="validator_index"} > 3 * 3600
              for: 5m
              labels:
                severity: warning
                projet: sn44
              annotations:
                summary: "Le collecteur SN44 n'a plus lu l'index du validateur depuis plus de 3 h"

            # L'index reçoit un challenge par Element toutes les ~60 min. Figé 3 h :
            # le validateur s'est arrêté ou a changé d'URL (commitment on-chain,
            # mettre à jour SN44_VALIDATOR_BASE_URL). Pas d'alerte dans les 4 h
            # qui suivent un démarrage du collecteur (historique trop court).
            - alert: SN44IndexFige
              expr: |
                max(changes(sn44_validator_index_last_block[3h])) == 0
                and on() (time() - max(process_start_time_seconds{job="sn44"})) > 4 * 3600
              for: 10m
              labels:
                severity: warning
                projet: sn44
              annotations:
                summary: "Aucun nouveau challenge dans l'index public du validateur SN44 depuis 3 h"

            - alert: SN44NouveauManifest
              expr: changes(sn44_manifest_block[1h]) > 0
              labels:
                severity: info
                projet: sn44
              annotations:
                summary: "Score a publié un nouveau manifest (Elements ou poids modifiés)"

            - alert: SN44ErreursCollecte
              expr: sum by (source) (increase(sn44_collector_errors_total[1h])) > 50
              labels:
                severity: warning
                projet: sn44
              annotations:
                summary: "Plus de 50 erreurs en 1 h sur une source du collecteur SN44"

  alertmanager_config:
    content: |
      route:
        receiver: discord
        group_by: [alertname, instance]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - matchers: ['projet="sn44"']
            receiver: discord-sn44
          - matchers: ['alertname="Watchdog"']
            receiver: healthchecks
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 2m

      # Une alerte critique masque sa version warning (même nom, même cible).
      inhibit_rules:
        - source_matchers: ['severity="critical"']
          target_matchers: ['severity="warning"']
          equal: [alertname, instance, mountpoint, chip, sensor]

      receivers:
        - name: discord
          discord_configs:
            - webhook_url_file: /run/secrets/discord_webhook_url
              send_resolved: true
              username: Prometheus
              title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ×{{ len .Alerts }}{{ end }}'
              # Résolue : pas de summary, sa valeur est figée au dernier déclenchement.
              message: |-
                {{ range .Alerts }}**{{ .Labels.severity }}** · {{ if eq .Status "firing" }}{{ .Annotations.summary }}{{ else }}{{ or .Labels.name .Labels.mountpoint .Labels.device .Labels.sensor .Labels.job .Labels.instance }} : repassé sous le seuil{{ end }}
                {{ end }}

        - name: discord-sn44
          discord_configs:
            - webhook_url_file: /run/secrets/sn44_discord_webhook_url
              send_resolved: true
              username: SN44
              title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ×{{ len .Alerts }}{{ end }}'
              message: |-
                {{ range .Alerts }}**{{ .Labels.severity }}** · {{ if eq .Status "firing" }}{{ .Annotations.summary }}{{ else }}{{ or .Labels.source .Labels.job .Labels.instance "sn44" }} : résolu{{ end }}
                {{ end }}

        - name: healthchecks
          webhook_configs:
            - url_file: /run/secrets/healthchecks_watchdog_url
              send_resolved: false

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

  # Tableaux de bord versionnés ici, en lecture seule dans Grafana (allowUiUpdates
  # false) : une modification passe par une PR, comme le reste.
  grafana_dashboards_provider:
    content: |
      apiVersion: 1
      providers:
        - name: homelab
          folder: SN44
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 300
          options:
            path: /etc/grafana/dashboards

  # Minage SN44 : collecte, gagnants par Element, conformité, liste noire.
  # Un panneau par ligne. Pas de `$` (Compose l'interpolerait) ; la CI vérifie le JSON.
  grafana_dashboard_sn44:
    content: |
      {"uid": "sn44", "title": "SN44 — Score / TurboVision", "tags": ["sn44", "bittensor"], "timezone": "browser", "schemaVersion": 39, "version": 1, "editable": false, "refresh": "5m", "time": {"from": "now-7d", "to": "now"}, "panels": [
        {"id":1,"type":"row","title":"Collecte","collapsed":false,"gridPos":{"x":0,"y":0,"w":24,"h":1},"panels":[]},
        {"id":2,"type":"stat","title":"Cible sn44","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":1,"w":4,"h":4},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"up{job=\"sn44\"}","instant":true}],"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none","textMode":"value"}},
        {"id":3,"type":"stat","title":"Dernière lecture de l'index","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":4,"y":1,"w":4,"h":4},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"time() - sn44_collector_last_success_timestamp_seconds{source=\"validator_index\"}","instant":true}],"fieldConfig":{"defaults":{"unit":"s","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":3600},{"color":"red","value":10800}]}},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none","textMode":"value"}},
        {"id":4,"type":"stat","title":"Shards","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":8,"y":1,"w":4,"h":4},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum(sn44_shards)","instant":true}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none","textMode":"value"}},
        {"id":5,"type":"stat","title":"Challenges / images","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":12,"y":1,"w":4,"h":4},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum(sn44_challenges)","instant":true,"legendFormat":"challenges"},{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"B","expr":"sum(sn44_images)","instant":true,"legendFormat":"images"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none","textMode":"value_and_name"}},
        {"id":6,"type":"stat","title":"Archive restante","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":16,"y":1,"w":4,"h":4},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sn44_backfill_remaining_keys","instant":true}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none","textMode":"value"}},
