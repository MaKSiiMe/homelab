  # Secrets : valeurs dans les variables de la stack Portainer, jamais dans git.
  # Passés par interpolation `${VAR:?}` (`secrets: environment:` ne reçoit pas
  # les variables Portainer) et copiés dans /run/secrets/<nom> (mode 0444).
  discord_webhook_url:
    content: ${DISCORD_WEBHOOK_URL:?à définir dans les variables de la stack Portainer}
  healthchecks_watchdog_url:
    content: ${HEALTHCHECKS_WATCHDOG_URL:?à définir dans les variables de la stack Portainer}
  grafana_admin_password:
    content: ${GRAFANA_ADMIN_PASSWORD:?à définir dans les variables de la stack Portainer}
  sn44_discord_webhook_url:
    content: ${SN44_DISCORD_WEBHOOK_URL:?à définir dans les variables de la stack Portainer}

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  metrics:
    name: metrics
    driver_opts:
      com.docker.network.bridge.name: br-metrics   # nom d'interface fixe pour UFW
    ipam:
      config:
        - subnet: 10.203.0.0/24
          gateway: 10.203.0.1
  socket:
    name: monitoring_socket                         # réseau du socket-proxy (stack monitoring)
    external: true
